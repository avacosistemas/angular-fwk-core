<div class="flex flex-col flex-auto min-w-0" *ngIf="crudDef">
    <div class="bg-white dark:bg-transparent flex-auto">

        <div *ngIf="isInlineViewActive; else standardCrud">
            <div class="px-6">
                <fwk-breadcrumb></fwk-breadcrumb>
            </div>

            <div class="flex items-center justify-between pb-4 px-6 border-b dark:border-gray-800">
                <div class="flex items-center gap-2">
                    <div class="text-3xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
                        {{ activeActionKey ? translate(activeActionKey) : (isEditing ? translate('cluster_edit_details_title') : translate('cluster_details_title')) }}
                    </div>
                    <back-button *ngIf="crudDef.backButton" color="accent" class="mr-1"></back-button>
                </div>

                <button *ngIf="!isEditing && showEditButton" mat-stroked-button color="accent" (click)="startEditing()">
                    <mat-icon class="mr-2">edit</mat-icon>
                    <span>{{ translate('cluster_edit_button') }}</span>
                </button>
            </div>

            <div *ngIf="isInlineViewActive; else standardCrud" class="p-6 max-w-5xl mx-auto">
                <div class="space-y-6">

                    <div *ngIf="isLoading || !renderForm" class="space-y-6 py-4 animate-pulse">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div *ngFor="let item of [1, 2, 3, 4, 5, 6]"
                                class="relative h-14 border border-gray-200 dark:border-gray-800 rounded-lg bg-transparent px-4 flex items-center">
                          
                                <div class="absolute -top-2 left-3 px-1.5 bg-white dark:bg-gray-900">
                                    <div class="h-1.5 bg-gray-200 dark:bg-gray-700 rounded w-16"></div>
                                </div>

                                <div class="h-3 bg-gray-100 dark:bg-gray-800 rounded w-1/3"></div>
                            </div>
                        </div>
                    </div>

                    <div class="relative py-2" *ngIf="!isLoading && renderForm">
                        <fwk-dynamic-form-component *ngIf="formFields.length > 0" [fields]="formFields"
                            [parentForm]="parentForm" [entity]="contactEntity" [isEdit]="isEditing">
                        </fwk-dynamic-form-component>

                        <div *ngIf="isInlineFileLoading" class="space-y-6 py-4 animate-pulse">
                            <div class="h-[600px] bg-gray-100 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-800 flex items-center justify-center">
                                <mat-progress-spinner [diameter]="48" mode="indeterminate" class="text-gray-400"></mat-progress-spinner>
                            </div>
                        </div>

                        <div *ngIf="!isInlineFileLoading && inlineFileUrl" class="w-full">
                            <iframe [src]="inlineFileUrl" class="w-full h-[650px] rounded-lg border border-gray-200 dark:border-gray-800 shadow-sm"></iframe>
                        </div>
                    </div>

                    <div *ngIf="isEditing && !isLoading && renderForm && !inlineFileUrl && !isInlineFileLoading"
                        class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-100 dark:border-gray-800">
                        <ng-container *ngIf="activeInnerActions.length > 0">
                            <button *ngFor="let innerAction of activeInnerActions"
                                    mat-stroked-button 
                                    [disabled]="isSaving"
                                    [color]="innerAction.type === 'warn' || innerAction.type === 'error' || innerAction.color === 'warn' ? 'warn' : (innerAction.type === 'info' ? 'primary' : 'accent')" 
                                    (click)="executeInnerAction(innerAction)" 
                                    class="px-4 mr-auto"
                                    [ngClass]="{
                                        'border-red-200 dark:border-red-800/50 hover:bg-red-50 dark:hover:bg-red-950/20 text-red-600 dark:text-red-400': innerAction.type === 'warn' || innerAction.type === 'error' || innerAction.color === 'warn',
                                        'border-blue-200 dark:border-blue-800/50 hover:bg-blue-50 dark:hover:bg-blue-950/20 text-blue-600 dark:text-blue-400': innerAction.type === 'info',
                                        'border-green-200 dark:border-green-800/50 hover:bg-green-50 dark:hover:bg-green-950/20 text-green-600 dark:text-green-400': innerAction.type === 'success'
                                    }">
                                <mat-icon *ngIf="innerAction.icon" class="mr-2"
                                          [ngClass]="{
                                              'text-red-600 dark:text-red-400': innerAction.type === 'warn' || innerAction.type === 'error' || innerAction.color === 'warn',
                                              'text-blue-600 dark:text-blue-400': innerAction.type === 'info',
                                              'text-green-600 dark:text-green-400': innerAction.type === 'success'
                                          }">{{ innerAction.icon }}</mat-icon>
                                <span>{{ translate(innerAction.actionNameKey) || innerAction.actionName }}</span>
                            </button>
                        </ng-container>
                        <button mat-stroked-button (click)="cancelEditing()" [disabled]="isSaving">
                            <span>{{ translate('cluster_cancel_button') }}</span>
                        </button>
                        <button mat-flat-button color="primary" [disabled]="parentForm.invalid || isSaving" (click)="saveChanges()">
                            <ng-container *ngIf="!isSaving">
                                <span>{{ translate('cluster_save_changes_button') }}</span>
                            </ng-container>
                            <mat-progress-spinner *ngIf="isSaving" [diameter]="20" mode="indeterminate" class="mx-auto"></mat-progress-spinner>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <ng-template #standardCrud>
            <fwk-crud [componentName]="crudDef.name" [crudDefinition]="crudDef">
            </fwk-crud>
        </ng-template>

    </div>
</div>
