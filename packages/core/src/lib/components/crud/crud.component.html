<div class="flex flex-col flex-auto min-w-0" *ngIf="crudDef && name">
    <div class="flex flex-col items-center justify-center border-b bg-card dark:bg-transparent">
        <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between px-4 sm:px-6 pt-4 pb-3 w-full">
            <div class="flex-1 min-w-0">
                <fwk-breadcrumb></fwk-breadcrumb>
                <div class="flex items-center">
                    <div class="flex items-center text-2xl sm:text-3xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
                        <span>{{ crudDef.i18n?.words?.['page_title'] || ('page_title_default' | translate) }}</span>
                        <help-button *ngIf="crudDef.urlHelp" [urlHelp]="crudDef.urlHelp"></help-button>
                    </div>
                    <back-button *ngIf="crudDef.backButton" color="accent"></back-button>
                </div>

                <div class="text-sm sm:text-lg text-secondary" *ngIf="parentTitle && !isInCluster">
                    {{ parentTitle }}
                </div>

                <div class="mt-1 text-sm sm:text-lg text-secondary" *ngIf="!parentTitle && crudDef.subtitleKey">
                    {{ crudDef.subtitleKey | translate:crudDef.i18n?.name }}
                </div>
            </div>

            <div class="flex shrink-0 items-center mt-1 sm:mt-0 sm:ml-4 space-x-2 print:hidden">
                <ng-container *ngIf="showCrudActions()">
                    <button *ngFor="let action of getCrudActions(); trackBy: trackByAction" mat-stroked-button color="accent"
                        [matTooltip]="action.actionName"
                        [disabled]="isTableLoading || actionLoadingStates.get(action.actionNameKey || action.actionName || 'default')"
                        (click)="executeCrudAction(action)">
                        <ng-container
                            *ngIf="!actionLoadingStates.get(action.actionNameKey || action.actionName || 'default')">
                            <div class="inline-flex items-center">
                                <mat-icon *ngIf="action.icon" [svgIcon]="action.icon"></mat-icon>
                                <span class="ml-2">{{ action.actionName || (action.actionNameKey ? (action.actionNameKey | translate:crudDef.i18n?.name) : '') }}</span>
                            </div>
                        </ng-container>
                        <mat-progress-spinner
                            *ngIf="actionLoadingStates.get(action.actionNameKey || action.actionName || 'default')"
                            [diameter]="24" mode="indeterminate"></mat-progress-spinner>
                    </button>
                </ng-container>

                <button *ngIf="showDeleteButton() && display.selects" mat-stroked-button [color]="'warn'"
                    [matTooltip]="'delete_selected_tooltip' | translate" [disabled]="isTableLoading"
                    (click)="openDeleteDialog()">
                    <mat-icon [svgIcon]="'heroicons_outline:trash'"></mat-icon>
                    <span class="ml-2 hidden sm:inline">{{ 'crud_delete_button' | translate }} ({{ selects.length }})</span>
                </button>

                <button *ngIf="crudDef.exportCsv || crudDef.exportFile" mat-icon-button color="accent" (click)="exportFile()"
                    [matTooltip]="'export_csv_tooltip' | translate" [disabled]="isTableLoading">
                    <mat-icon [svgIcon]="'heroicons_outline:printer'"></mat-icon>
                </button>

                <button *ngIf="crudDef.downloadBoleta" mat-icon-button color="accent" (click)="downloadBoleta()"
                    [matTooltip]="'crud_download_boleta_tooltip' | translate" [disabled]="isTableLoading">
                    <mat-icon [svgIcon]="'heroicons_outline:document-text'"></mat-icon>
                </button>

                <button *ngIf="crudDef.openLink" mat-icon-button color="accent" (click)="goToLink(crudDef.openLink)"
                    [matTooltip]="crudDef.openLinkTitle || ('crud_open_link_default_tooltip' | translate)"
                    [disabled]="isTableLoading">
                    <mat-icon [svgIcon]="'heroicons_outline:envelope'"></mat-icon>
                </button>

                <button *ngIf="showAddButton()" mat-stroked-button color="accent" [disabled]="isTableLoading"
                    (click)="openAddDialog()">
                    <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                    <span class="ml-2">{{ 'add_button' | translate:crudDef.i18n?.name }}</span>
                </button>
            </div>
        </div>

        <div *ngIf="deniedCreateAlerts.length > 0 || generalAlerts.length > 0" class="flex flex-col gap-2 w-full px-4 sm:px-6 pb-4 pt-0">
            <fwk-alert *ngFor="let alert of deniedCreateAlerts; trackBy: trackByAlert"
                class="max-w-full" [type]="alert.type" [appearance]="'soft'" [showIcon]="true">
                <span [innerHTML]="alert.messageKey | translate:alert.params:crudDef.i18n?.name"></span>
            </fwk-alert>

            <fwk-alert *ngFor="let alert of generalAlerts; trackBy: trackByAlert"
                class="max-w-full" [type]="alert.type" [appearance]="'soft'" [showIcon]="true">
                <span [innerHTML]="alert.messageKey | translate:alert.params:crudDef.i18n?.name"></span>
            </fwk-alert>
        </div>

        <div *ngIf="crudDef.forms?.filter" class="w-full print:hidden">
            <fwk-search #searchComponent [fields]="crudDef.forms.filter"
                (onChangeSearchEntity)="filterSearchEntity($event)" [forceFirstSubmit]="true" [crudDef]="crudDef"
                [columnsDef]="crudDef.grid?.columnsDef" [displayedColumns]="crudDef.grid?.displayedColumns"
                (displayedColumnsChange)="onDisplayedColumnsChange($event)" [i18n]="i18nComponent">
            </fwk-search>
        </div>
    </div>

    <div class="flex-auto">
        <div class="flex flex-auto flex-col h-full relative">
            <fwk-crud-table *ngIf="crudDef.grid" class="flex flex-auto flex-col h-full" [containerClass]="isTableLoading ? 'h-[67vh]' : 'flex flex-auto flex-col h-full'"
                [onClickRow]="onClickRow" [datasource]="dataSource" [canDelete]="showDeleteButton()"
                [searchPerformed]="searchPerformed" [grid]="crudDef.grid" [crud]="this" [isLoading]="isTableLoading"
                [updatingRowId]="updatingRowId"
                [hasActiveFilters]="hasActiveFilters" [canAdd]="showAddButton()"
                [hasLoadError]="hasLoadError" [errorType]="errorType"
                (status)="statusChanged($event)"
                (onChangePagination)="handlePageChange()" (onAddClicked)="openAddDialog()"
                (onClearFiltersClicked)="clearFilters()" (onRowClicked)="handleRowClick($event)">
            </fwk-crud-table>
        </div>
    </div>
</div>
