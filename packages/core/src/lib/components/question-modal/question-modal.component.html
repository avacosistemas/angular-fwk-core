<div class="p-6 sm:p-7 flex flex-col items-center text-center w-full">
    
    <div *ngIf="data.icon?.show"
        class="flex items-center justify-center p-5 rounded-full mb-4 shrink-0 shadow-xs transition-transform duration-300 hover:scale-105 border"
        [ngClass]="getIconContainerClass()">
        <mat-icon [svgIcon]="(data.icon?.name && data.icon?.name !== 'heroicons_outline:question-mark-circle') ? data.icon!.name! : (getIconColorClass().includes('red') ? 'heroicons_outline:exclamation-triangle' : 'heroicons_outline:question-mark-circle')"
            class="!w-7 !h-7"
            [ngClass]="getIconColorClass()"></mat-icon>
    </div>

    <h2 *ngIf="data.title" class="text-xl sm:text-2xl font-bold tracking-tight text-gray-900 dark:text-gray-100 m-0 text-center leading-tight">
        {{ data.title }}
    </h2>

    <div class="text-sm sm:text-base text-gray-500 dark:text-gray-400 text-center mt-2 leading-relaxed px-1 sm:px-4 max-w-sm"
        [innerHTML]="data.message">
    </div>

    <div class="flex flex-col-reverse sm:flex-row items-center justify-stretch gap-3 mt-7 w-full">
        <button *ngIf="data.actions?.cancel?.show"
            mat-stroked-button
            [disabled]="isSubmitting"
            (click)="onReject()"
            class="w-full sm:w-1/2 flex-1 !rounded-full !h-11 text-sm font-semibold border-gray-300 dark:border-gray-700">
            {{ data.actions?.cancel?.label || ('modal_button_cancel' | translate) }}
        </button>

        <button *ngIf="data.actions?.confirm?.show"
            mat-flat-button
            [color]="data.actions?.confirm?.color"
            [disabled]="isSubmitting"
            (click)="onSubmit()"
            class="w-full sm:w-1/2 flex-1 !rounded-full !h-11 text-sm font-semibold shadow-xs">
            <span *ngIf="!isSubmitting">
                {{ data.actions?.confirm?.label || ('modal_button_confirm' | translate) }}
            </span>
            <mat-progress-spinner *ngIf="isSubmitting" [diameter]="20" mode="indeterminate" class="mx-auto"></mat-progress-spinner>
        </button>
    </div>

</div>
