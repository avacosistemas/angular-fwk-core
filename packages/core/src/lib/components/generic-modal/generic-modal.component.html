<div class="p-6 sm:p-7 flex flex-col items-center text-center w-full max-w-[500px]">
    
    <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-4 shrink-0 border shadow-xs transition-transform duration-300 hover:scale-105"
        [ngClass]="getIconBackgroundClass()">
        <mat-icon [svgIcon]="getIconName()" [ngClass]="getIconColorClass()" class="!w-7 !h-7"></mat-icon>
    </div>

    <h2 *ngIf="data.title" class="text-xl sm:text-2xl font-bold tracking-tight text-gray-900 dark:text-gray-100 m-0 text-center leading-tight">
        {{ data.title }}
    </h2>

    <div class="text-sm sm:text-base text-gray-500 dark:text-gray-400 text-center mt-2 leading-relaxed px-1 sm:px-4 w-full max-w-sm">
        <div *ngIf="data.message" [innerHTML]="data.message"></div>
        <div #customComponentContainer class="mt-4 text-left w-full"></div>
    </div>

    <div class="flex flex-col-reverse sm:flex-row items-center justify-stretch gap-3 w-full">
        <button *ngIf="data.cancelButtonText"
            mat-stroked-button
            (click)="onCancel()"
            class="w-full sm:w-1/2 flex-1 !rounded-full !h-11 text-sm font-semibold border-gray-300 dark:border-gray-700">
            {{ data.cancelButtonText }}
        </button>

        <button *ngIf="data.showConfirmButton !== false"
            mat-flat-button
            [color]="getConfirmColor()"
            (click)="onConfirm()"
            [disabled]="data.customComponent && !isCustomComponentValid"
            class="w-full sm:w-1/2 flex-1 !rounded-full !h-11 text-sm font-semibold shadow-xs">
            {{ data.confirmButtonText || ('modal_button_confirm' | translate) }}
        </button>
    </div>

</div>
