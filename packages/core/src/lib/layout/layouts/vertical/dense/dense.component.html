<fwk-loading-bar></fwk-loading-bar>

<fwk-vertical-navigation class="dark bg-gray-900 print:hidden" [appearance]="navigationAppearance"
    [mode]="isScreenSmall ? 'over' : 'side'" [name]="'mainNavigation'" [navigation]="navigation.default"
    [opened]="sidebarOpened && !isScreenSmall">

    <ng-container fwkVerticalNavigationContentHeader>
        <div [routerLink]="'/'" class="flex items-center cursor-pointer justify-center pt-4">
            <fwk-logo context="sidebar" size="small" type="icon"></fwk-logo>
        </div>
        <ng-container *ngIf="customTopComponent">
            <ng-container *ngComponentOutlet="customTopComponent"></ng-container>
        </ng-container>
    </ng-container>

    <ng-container fwkVerticalNavigationContentFooter>
        <div class="flex flex-col items-center justify-center w-full p-4 space-y-2">
            <button *ngIf="showCollapseSidebarIcon" class="hidden md:inline-flex" mat-icon-button
                (click)="toggleNavigationAppearance()">
                <mat-icon [svgIcon]="'heroicons_outline:arrows-right-left'"></mat-icon>
            </button>
        </div>

        <ng-container *ngIf="customFooterComponent">
            <ng-container *ngComponentOutlet="customFooterComponent"></ng-container>
        </ng-container>
    </ng-container>
</fwk-vertical-navigation>

<div class="flex flex-col flex-auto w-full min-w-0 h-screen overflow-auto">
    <div
        class="bg-card dark:bg-transparent dark:shadow-none flex flex-0 items-center p-2 sm:px-4 print:hidden relative w-full z-30">
        <div class="flex items-center space-x-2">
            <button mat-icon-button (click)="toggleNavigation('mainNavigation')">
                <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
            </button>
        </div>

        <span class="w-1 h-6 mx-1 border-r border-gray-300 dark:border-gray-700"></span>

        <fwk-search-button></fwk-search-button>

        <ng-container *ngIf="customTopbarComponent">
            <div class="flex items-center ml-2">
                <ng-container *ngComponentOutlet="customTopbarComponent"></ng-container>
            </div>
        </ng-container>

        <div class="flex items-center pl-2 mr-2 ml-auto space-x-0.5 sm:space-x-2">
            <user></user>
        </div>
    </div>

    <div class="flex flex-auto overflow-hidden relative" [ngClass]="{'border-t': showClusterSidebar}">

        <div *ngIf="showClusterSidebar && !isScreenSmall"
            class="flex flex-col flex-shrink-0 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 transition-all duration-300 ease-in-out select-none"
            [ngClass]="clusterCollapsed ? 'w-16' : 'w-64'">

            <div class="flex items-center justify-between p-3 sm:p-4 border-b border-gray-100 dark:border-gray-800"
                [ngClass]="clusterCollapsed ? 'flex-col space-y-3' : 'flex-row'">

                <div *ngIf="!clusterCollapsed" class="flex flex-col min-w-0 pr-2">
                    <span *ngIf="clusterTitlePrefix"
                        class="text-[10px] text-gray-400 dark:text-gray-500 tracking-wider uppercase">
                        {{ clusterTitlePrefix }}
                    </span>
                    <span
                        class="text-base font-extrabold text-gray-800 dark:text-gray-100 tracking-tight truncate"
                        [title]="clusterTitle">
                        {{ clusterTitle }}
                    </span>
                </div>

                <button mat-icon-button (click)="toggleClusterCollapse()" class="text-gray-400 dark:text-gray-500">
                    <mat-icon>{{ clusterCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
                </button>
            </div>

            <div *ngIf="!clusterCollapsed && activeProfileActions.length > 0" class="px-3 sm:px-4 pt-3">
                <button type="button" [matMenuTriggerFor]="actionsMenu"
                    class="flex items-center justify-center w-full px-4 py-2.5 text-sm font-semibold rounded-lg border-0 bg-blue-600 hover:bg-blue-700 text-white cursor-pointer transition-all duration-150 select-none shadow-sm">
                    <mat-icon class="mr-2 text-white">menu</mat-icon>
                    <span>{{ translate('cluster_actions_button') }}</span>
                </button>
                <mat-menu #actionsMenu="matMenu"
                    class="rounded-xl shadow-xl border border-gray-100 dark:border-gray-800 max-h-[300px] overflow-y-auto">
                    <button mat-menu-item *ngFor="let action of activeProfileActions" (click)="executeAction(action)"
                        class="flex items-center text-sm font-medium py-2"
                        [class.menu-item-warn]="action.color === 'warn'">
                        <mat-icon *ngIf="action.icon.includes(':')" [svgIcon]="action.icon" class="mr-3"
                            [class.text-gray-500]="action.color !== 'warn'"></mat-icon>
                        <mat-icon *ngIf="!action.icon.includes(':')" class="mr-3"
                            [class.text-gray-500]="action.color !== 'warn'">{{ action.icon }}</mat-icon>
                        <span>{{ translate(action.actionNameKey) }}</span>
                    </button>
                </mat-menu>
            </div>

            <div *ngIf="clusterCollapsed && activeProfileActions.length > 0" class="flex justify-center pt-2 mb-2">
                <button mat-icon-button [matMenuTriggerFor]="actionsMenuCollapsed" color="primary"
                    [matTooltip]="translate('cluster_actions_button')" matTooltipPosition="right">
                    <mat-icon>menu</mat-icon>
                </button>
                <mat-menu #actionsMenuCollapsed="matMenu"
                    class="rounded-xl shadow-xl border border-gray-100 dark:border-gray-800 profile-actions-menu-panel"
                    panelClass="profile-actions-menu-panel">
                    <button mat-menu-item *ngFor="let action of activeProfileActions" (click)="executeAction(action)"
                        class="flex items-center text-sm font-medium py-2"
                        [class.menu-item-warn]="action.color === 'warn'">
                        <mat-icon *ngIf="action.icon.includes(':')" [svgIcon]="action.icon" class="mr-3"
                            [class.text-gray-500]="action.color !== 'warn'"></mat-icon>
                        <mat-icon *ngIf="!action.icon.includes(':')" class="mr-3"
                            [class.text-gray-500]="action.color !== 'warn'">{{ action.icon }}</mat-icon>
                        <span>{{ translate(action.actionNameKey) }}</span>
                    </button>
                </mat-menu>
            </div>

            <div class="flex-auto py-2 overflow-y-auto space-y-1 px-3">
                <a *ngFor="let item of activeSidebarItems" (click)="navigateTo(item)"
                    class="flex items-center px-2 py-2.5 rounded-xl text-[13px] font-semibold transition-all duration-150 cursor-pointer group"
                    [ngClass]="[
                                isItemActive(item) ? 
                                    'bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 font-bold shadow-2xs' : 
                                    'text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800/50 hover:text-gray-900 dark:hover:text-gray-100',
                                clusterCollapsed ? 'justify-center' : ''
                                ]"
                    [matTooltip]="clusterCollapsed ? (translate(item.actionNameKey) || item.label) : ''"
                    matTooltipPosition="right">

                    <mat-icon *ngIf="item.icon.includes(':')" [svgIcon]="item.icon"
                        class="icon-size-5 flex-shrink-0 transition-transform group-hover:scale-110"
                        [ngClass]="isItemActive(item) ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 dark:text-gray-500'"></mat-icon>

                    <mat-icon *ngIf="!item.icon.includes(':')"
                        class="icon-size-5 flex-shrink-0 transition-transform group-hover:scale-110"
                        [ngClass]="isItemActive(item) ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 dark:text-gray-500'">{{
                        item.icon }}</mat-icon>

                    <span *ngIf="!clusterCollapsed" class="ml-2.5 truncate text-[13px] font-semibold">
                        {{ translate(item.actionNameKey) || item.label }}
                    </span>
                </a>
            </div>
        </div>

        <div
            class="flex-auto overflow-y-auto relative bg-white dark:bg-transparent flex flex-col min-h-0 w-full min-w-0">

            <div *ngIf="showClusterSidebar && isScreenSmall"
                class="sticky top-0 w-full bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 print:hidden z-50 select-none flex-none">

                <div (click)="toggleClusterCollapse()" class="flex items-center justify-between p-3 border-b border-gray-100 dark:border-gray-800">
                    <div class="flex flex-col min-w-0">
                        <span *ngIf="clusterTitlePrefix"
                            class="text-[10px] text-gray-400 dark:text-gray-500 tracking-wider uppercase">
                            {{ clusterTitlePrefix }}
                        </span>
                        <div class="flex items-center gap-1.5 min-w-0 text-base font-extrabold">
                            <span class="text-gray-800 dark:text-gray-100 tracking-tight truncate">
                                {{ clusterTitle }}
                            </span>
                            <span class="text-gray-300 dark:text-gray-600">/</span>
                            <span class="text-blue-600 dark:text-blue-400 truncate">
                                {{ activeItemLabel || 'Menú' }}
                            </span>
                        </div>
                    </div>

                    <button *ngIf="showClusterSidebar && isScreenSmall && clusterCollapsed" mat-icon-button
                        class="text-gray-500 hover:text-gray-900 dark:hover:text-white">
                        <mat-icon svgIcon="heroicons_outline:bars-3" class="!w-6 !h-6"></mat-icon>
                    </button>

                    <button *ngIf="showClusterSidebar && isScreenSmall && !clusterCollapsed" mat-icon-button
                        class="text-gray-500 hover:text-gray-900 dark:hover:text-white">
                        <mat-icon svgIcon="heroicons_outline:x-mark" class="!w-6 !h-6"></mat-icon>
                    </button>
                </div>
            </div>

            <div *ngIf="showClusterSidebar && isScreenSmall && !clusterCollapsed"
                class="fixed inset-x-0 bottom-0 z-40 !top-[7rem] bg-white dark:bg-gray-900 w-full p-4 sm:p-6 flex flex-col select-none print:hidden overflow-hidden">
                <div *ngIf="activeProfileActions.length > 0" class="mb-3">
                    <button type="button" [matMenuTriggerFor]="actionsMenuMobileFull"
                        class="flex items-center justify-center w-full px-4 py-2.5 text-sm font-bold rounded-xl border-0 bg-blue-600 text-white shadow-sm">
                        <mat-icon class="mr-2 text-white">menu</mat-icon>
                        <span>{{ translate('cluster_actions_button') }}</span>
                    </button>
                    <mat-menu #actionsMenuMobileFull="matMenu"
                        class="rounded-xl shadow-xl border border-gray-100 dark:border-gray-800">
                        <button mat-menu-item *ngFor="let action of activeProfileActions"
                            (click)="executeAction(action)">
                            <mat-icon *ngIf="action.icon" [svgIcon]="action.icon.includes(':') ? action.icon : ''"
                                class="mr-3"></mat-icon>
                            <span>{{ translate(action.actionNameKey) }}</span>
                        </button>
                    </mat-menu>
                </div>

                <div class="flex-1 space-y-1 overflow-y-auto min-h-0 pt-1">
                    <a *ngFor="let item of activeSidebarItems" (click)="navigateTo(item)"
                        class="flex items-center pl-1 pr-3 py-3 rounded-xl text-base font-semibold transition-colors cursor-pointer"
                        [ngClass]="isItemActive(item) ? 
                                  'bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 font-bold' : 
                                  'text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800/50'">

                        <mat-icon *ngIf="item.icon" [svgIcon]="item.icon.includes(':') ? item.icon : ''"
                            class="!w-5 !h-5 mr-3 shrink-0"
                            [ngClass]="isItemActive(item) ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 dark:text-gray-500'"></mat-icon>

                        <mat-icon *ngIf="item.icon && !item.icon.includes(':')" class="!w-5 !h-5 mr-3 shrink-0"
                            [ngClass]="isItemActive(item) ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 dark:text-gray-500'">{{
                            item.icon }}</mat-icon>

                        <span class="truncate text-base font-semibold">{{ translate(item.actionNameKey) || item.label
                            }}</span>
                    </a>
                </div>

            </div>

            <div class="flex-auto relative z-0">
                <router-outlet *ngIf="true"></router-outlet>
            </div>

            <ng-container *ngIf="customMainFooterComponent">
                <ng-container *ngComponentOutlet="customMainFooterComponent"></ng-container>
            </ng-container>
        </div>
    </div>

</div>
